name: Drive extract

# Runs ONLY when triggered:
#  - repository_dispatch (type: drive-upload) fired by the Apps Script watcher
#    when a new image lands in the Incoming Drive folder, or
#  - manually from the Actions tab (workflow_dispatch), optionally for one file id.
# It never polls on a schedule, so free runner minutes are spent only on real work.
on:
  repository_dispatch:
    types: [drive-upload]
  workflow_dispatch:
    inputs:
      file_id:
        description: "Drive file ID to process (blank = process everything in Incoming)"
        required: false
        default: ""

# folder names in your Drive (change here if you renamed them)
env:
  INPUT_FOLDER: Incoming
  ARCHIVE_FOLDER: Archive
  OUTPUT_FOLDER: Extracted

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PyTorch (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            torch==2.12.1 torchvision==0.27.1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache model downloads (docling / huggingface / rapidocr)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/docling
            ~/.cache/rapidocr
          key: model-cache-${{ runner.os }}-v1

      - name: Run extraction
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          HF_HUB_DISABLE_SYMLINKS: "1"
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
          # file id from the event payload, or the manual input, or "" (scan all)
          FILE_ID: ${{ github.event.client_payload.file_id || github.event.inputs.file_id }}
        run: |
          python drive_flow.py \
            --input "$INPUT_FOLDER" \
            --archive "$ARCHIVE_FOLDER" \
            --output "$OUTPUT_FOLDER" \
            --res4k \
            --timeout 3000 \
            --file-id "$FILE_ID"
